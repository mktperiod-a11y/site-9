name: Harbor publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: harbor-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm test
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
      - run: npx playwright install --with-deps chromium
      - name: Validate deployed path layout
        run: |
          mv _site _production
          SITE_URL=http://localhost:4173 npm run build
          python3 -m http.server 4173 --directory _site &
          npm run check:screen
          rm -rf _site
          mv _production _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: release
